name: codex-ab-benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Evaluation suite"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - linguistic-pilot
      limit:
        description: "Number of eval cases (blank = all)"
        required: false
        default: "20"
      model:
        description: "Optional Codex model slug"
        required: false
        default: ""
      reasoning:
        description: "Optional model reasoning effort (low/medium/high/xhigh when supported)"
        required: false
        default: ""

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require benchmark credential
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "OPENAI_API_KEY repository secret is not configured; benchmark not executed."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Validate benchmark matrix
        run: python evals/benchmark_matrix.py evals/benchmark_matrix.json
      - name: Run A/B
        run: |
          ARGS=()
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          if [ -n "${{ inputs.model }}" ]; then ARGS+=(--model "${{ inputs.model }}"); fi
          if [ -n "${{ inputs.reasoning }}" ]; then ARGS+=(--reasoning "${{ inputs.reasoning }}"); fi
          if [ "${{ inputs.suite }}" = "linguistic-pilot" ]; then
            ARGS+=(--evals-glob 'evals/linguistic_core_pilot_*.jsonl')
          fi
          python evals/run_ab_codex.py "${ARGS[@]}"
      - name: Score linguistic pilot
        if: ${{ inputs.suite == 'linguistic-pilot' }}
        run: |
          python evals/score_linguistic_pilot.py \
            evals/results/ab_results.jsonl \
            --out evals/results/linguistic_score.json
          cat evals/results/linguistic_score.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arab-writer-ab-${{ inputs.suite }}-results
          path: evals/results/
          if-no-files-found: ignore
